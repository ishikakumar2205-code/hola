<html>
    <head>
        <title>Media In HTML</title>
    </head>

    <body>
        <h1> Media in HTML</h1>
     <img scr="media in html/rocket 1.png" alt="Example Image" width="300">

     <h2>Audio Example</h2>
     <audio controls>
        <source scr="media in html/purrplecat-long-day-518602 (3).mp3" type="audio/mpeg">
        Your browser does not support the audio element
     </audio>

     <h2>Video Example</h2>
     <video width="320" height="240" controls>
        <source scr="media in html/384550_medium.mp4" type="media in html/384550_medium.mp4">
        You're browser does not support this video tag
     </video> 
     <h2> Embedded Youtube Video [Golden brown x Love Story]</h2>
     <br><br>
     <iframe width="560" height="315" src="https://www.youtube.com/embed/7eLC4LnddHk?si=tM1QxyREtKtgqI8J"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
